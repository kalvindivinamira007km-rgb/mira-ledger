<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Mira Ledger</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFE5EC">
<script>/* Apply the chosen look before anything draws, so there's no flash. */try{var t=localStorage.getItem("mira-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<meta name="description" content="Track your money with numbers you can always check and edit.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mira Ledger">
<link rel="stylesheet" href="styles.css">
</head><body>
<main id="view"></main>
<nav id="nav" aria-label="Main"></nav>
<div id="sheet"></div>
<div id="toast" role="status" hidden></div>
<input type="file" id="receiptFile" accept="image/*" hidden>
<input type="file" id="restoreFile" hidden>
<script src="core.js"></script>
<script src="app.js"></script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body></html>
